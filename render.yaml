services:
  - type: web
    name: govai-3d-agent-orchestrator
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: ENABLE_OS_BRIDGE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-2.5-pro
      - key: GEMINI_MODEL_FAST
        value: gemini-2.5-flash
      - key: API_AUTH_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: TELERID_USERNAME
        sync: false
      - key: TELERID_PASSWORD
        sync: false
      - key: TELERID_API_TOKEN
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
