services:
  - type: web
    name: ultimate-werewolf-thai
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: AI_TIMEOUT_MS
        value: "20000"
      - key: AI_PROVIDER_ORDER
        value: gemini,groq,openrouter,openai,deepseek,anthropic
      - key: AI_MIX_PROVIDERS
        value: "false"
